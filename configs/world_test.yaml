profiles:
  blue:
    capacity: 8
    max_action_qty: 4
    can_flip: true
    v_max: 0.2
    a_max: 1
    handle_time:
      PICK: 0.2
      PLACE: 0.2
      FLIP: 0.1
      STEAL: 0.3
  yellow:
    capacity: 8
    max_action_qty: 4
    can_flip: true
    v_max: 0.2
    a_max: 1
    handle_time:
      PICK: 0.2
      PLACE: 0.2
      FLIP: 0.1
      STEAL: 0.3
reward:
  pantry_bonus: 3.0
  nest_bonus: 2.0
  interest_bonus: 5.0
  finish_in_nest_bonus: 10.0
world:
  allow_steal: true
  seed: 42
  record_history: false
network:
  hidden_sizes:
    - 128
    - 128
training:
  num_iterations: 10000
  games_per_iter: 16
  training_steps: 400
  batch_size: 256
  replay_capacity: 100000
  num_simulations: 64
  max_env_steps: 50
  cpuct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  learning_rate: 0.001
  weight_decay: 0.0001
  max_grad_norm: 5.0
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  entropy_weight: 0.0
  temperature: 1.0
  temperature_decay_steps: 30
  log_dir: runs
  run_name: alphazero_test
  enable_tensorboard: false
  checkpoint_path: runs/checkpoints/alphazero_test.pt
  checkpoint_interval: 1
  resume_from_checkpoint: false
